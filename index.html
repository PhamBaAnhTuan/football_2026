<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý giải bóng đá</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --brand:#0ea47a; --brand-dark:#0a7d5d; --brand-soft:#e7f6f1;
  --ink:#0f172a; --muted:#64748b; --line:#e6ebf1; --bg:#f5f7f9; --card:#fff;
  --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:20px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt{margin-top:10px}
.spacer{flex:1}

/* ---------- Layout ---------- */
header{
  background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.logo .ball{
  width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#0b8f6b);
  display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(14,164,122,.3)
}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line);margin-left:auto;flex-wrap:wrap}
.tab{
  padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;
  border:none;background:transparent;font-size:13.5px;font-family:inherit;transition:.15s;white-space:nowrap
}
.tab:hover{color:var(--ink)}
.tab.active{background:#fff;color:var(--brand-dark);box-shadow:0 1px 3px rgba(15,23,42,.08)}
main{max-width:1200px;margin:0 auto;padding:22px 20px 80px}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid transparent;
  font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  background:#fff;color:var(--ink)
}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(14,164,122,.28)}
.btn.primary:hover{background:var(--brand-dark)}
.btn.ghost{border-color:var(--line);background:#fff;color:#334155}
.btn.ghost:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fee2e2}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;
  cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--muted);transition:.15s
}
.icon-btn:hover{background:#f1f5f9;color:var(--ink)}

/* ---------- Inputs ---------- */
.input,select.input,textarea.input{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;
  font-size:13.5px;background:#fff;color:var(--ink);outline:none;transition:.15s
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,164,122,.13)}
.search{max-width:340px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-weight:600;font-size:12.5px;color:#475569}
.field>span em{font-style:normal;font-weight:500;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.row-actions{display:flex;gap:2px;align-items:center}

.team-top{display:flex;align-items:center;gap:11px}
.avatar{
  width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-dark);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto
}
.team-info{flex:1;min-width:0}
.team-info h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border-radius:8px;padding:4px 9px;
  font-size:12.5px;font-weight:500;color:#334155
}
.chip.cap{background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.chip.cap em{font-style:normal;font-size:10.5px;opacity:.7;font-weight:700}
.chip-x{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:11px;padding:0 0 0 2px;line-height:1}
.chip-x:hover{color:var(--red)}

/* ---------- Tables ---------- */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{
  text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.04em;padding:7px 6px;border-bottom:1px solid var(--line)
}
.table td{padding:8px 6px;border-bottom:1px solid #f1f5f9}
.table tbody tr:last-child td{border-bottom:none}
.table .tname{font-weight:600}
.standings td:not(.tname),.standings th:not(:nth-child(2)){text-align:center;width:34px}
.standings tr.qualify td{background:rgba(14,164,122,.055)}
.standings tr.qualify td:first-child{box-shadow:inset 3px 0 0 var(--brand)}

/* ---------- Toolbar / badges ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.badge{
  display:inline-block;padding:2.5px 8px;border-radius:7px;font-size:11.5px;font-weight:700;
  background:var(--brand-soft);color:var(--brand-dark)
}
.badge.soft{background:#f1f5f9;color:#475569}
.badge.gray{background:#f1f5f9;color:#64748b}
.badge.live{background:#fef3c7;color:#92400e}
.badge.done{background:#dcfce7;color:#166534}

/* ---------- Match rows ---------- */
.match{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;
  transition:.15s;margin-bottom:9px
}
.match:hover{border-color:#cbd5e1;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.m-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.m-top .spacer{flex:1}
.m-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.m-team{font-weight:600;font-size:14px}
.m-team.home{text-align:right}
.m-team.away{text-align:left}
.m-team.win{color:var(--brand-dark)}
.m-team.win::after{content:' ▸';font-size:10px;opacity:.55}
.m-team.home.win::after{content:''}
.m-team.home.win::before{content:'◂ ';font-size:10px;opacity:.55}
.m-score{
  font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:#f8fafc;border-radius:9px;
  padding:4px 14px;min-width:74px;text-align:center;color:#334155;letter-spacing:.02em
}
.m-score.done{background:var(--brand-soft);color:var(--brand-dark)}
.day-group{margin-bottom:22px}
.day-head{
  display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:700;font-size:13px;color:#334155
}
.day-head .line{flex:1;height:1px;background:var(--line)}
.cards-line{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px;justify-content:center}

/* ---------- Bracket ---------- */
.bracket{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 20px;align-items:stretch}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:236px;flex:0 0 auto}
.bracket-col h4{
  font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;
  padding-bottom:6px;border-bottom:2px solid var(--brand-soft);margin-bottom:4px
}
.bmatch{
  background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:.15s;
  box-shadow:0 1px 2px rgba(15,23,42,.04)
}
.bmatch:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(14,164,122,.15)}
.bmatch.third{border-style:dashed}
.brow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px;font-size:13px}
.brow+.brow{border-top:1px solid #f1f5f9}
.brow .bname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bname i{font-style:normal;color:#cbd5e1;font-weight:500;font-size:12.5px}
.brow .bscore{font-weight:800;font-variant-numeric:tabular-nums;color:#64748b;font-size:13.5px}
.brow .bscore em{font-style:normal;font-size:11px;color:var(--muted);margin-left:3px;font-weight:600}
.brow.win{background:rgba(14,164,122,.07)}
.brow.win .bname{color:var(--brand-dark)}
.brow.win .bscore{color:var(--brand-dark)}
.bmeta{
  padding:5px 12px;background:#f8fafc;border-top:1px solid #f1f5f9;font-size:11px;color:var(--muted);
  display:flex;gap:8px;justify-content:space-between
}

/* ---------- Empty ---------- */
.empty{
  text-align:center;padding:56px 20px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)
}
.empty .ico{font-size:38px;margin-bottom:12px}
.empty h3{margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;
  animation:fade .16s ease
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(15,23,42,.25);
  animation:pop .18s ease
}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:#fbfcfd;border-radius:0 0 16px 16px}

.member-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.member-row .input{flex:1}

.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:6px}
.score-team{font-weight:700;text-align:center;font-size:14px}
.score-input{
  width:100%;text-align:center;font-size:26px;font-weight:800;padding:8px;border-radius:12px;
  border:1px solid var(--line);font-family:inherit;outline:none;background:#f8fafc;color:var(--ink)
}
.score-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(14,164,122,.13)}
.score-sep{font-weight:800;color:#cbd5e1;font-size:20px}
.subhead{
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#0f172a;color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:200;
  box-shadow:0 10px 30px rgba(15,23,42,.3)
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--brand-dark)}
.toast.err{background:#b91c1c}

/* ---------- Brand ---------- */
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text small{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}

/* ---------- Context bar (bộ môn · nam/nữ) ---------- */
.ctxbar{border-top:1px solid var(--line);background:linear-gradient(180deg,#fafcfb 0%,#fff 100%)}
.cwrap{max-width:1200px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:12px;overflow-x:auto;scrollbar-width:thin}
.sport-pills{display:flex;gap:6px;flex:0 0 auto}
.sport-pill{
  display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-family:inherit;font-weight:600;font-size:13px;color:#334155;cursor:pointer;white-space:nowrap;transition:.15s
}
.sport-pill .ic{width:26px;height:26px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:14px;transition:.15s}
.sport-pill .cnt{font-size:11px;font-weight:700;color:var(--muted);background:#f1f5f9;border-radius:999px;padding:2px 7px}
.sport-pill:hover{border-color:#cbd5e1;transform:translateY(-1px)}
.sport-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(15,23,42,.18)}
.sport-pill.active .ic{background:rgba(255,255,255,.14)}
.sport-pill.active .cnt{background:rgba(255,255,255,.16);color:#fff}
.vsep{width:1px;height:26px;background:var(--line);flex:0 0 auto}
.gseg{display:flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:11px;flex:0 0 auto}
.gbtn{
  border:1px solid transparent;background:transparent;padding:5px 13px;border-radius:8px;font-family:inherit;font-size:13px;
  font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s
}
.gbtn:hover{color:var(--ink)}
.gbtn.active{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.1)}
.gbtn.male.active{color:#1d4ed8}
.gbtn.female.active{color:#be185d}
.gbtn.missing{border:1px dashed #cbd5e1;color:#94a3b8;font-weight:500}
.gbtn.missing:hover{border-color:var(--brand);color:var(--brand-dark);background:#fff}
.ctx-current{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;min-width:0}
.ctx-current b{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.ctx-actions{display:flex;gap:6px;flex:0 0 auto}
@media(max-width:900px){.ctx-current{display:none}}
.gbadge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.gbadge.male{background:#eff6ff;color:#1d4ed8}
.gbadge.female{background:#fdf2f8;color:#be185d}

/* ---------- Tournament manager ---------- */
.mg-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mg-stats>div{background:linear-gradient(135deg,var(--brand-soft),#f4fbf8);border-radius:12px;padding:12px 14px}
.mg-stats b{display:block;font-size:20px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.mg-stats span{font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:600px){.mg-stats{grid-template-columns:1fr 1fr}}
.sport-sec{margin-bottom:16px}
.sport-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sport-head h4{font-size:14px}
.sport-ic{width:32px;height:32px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.tgrid{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;cursor:pointer;transition:.15s;background:#fff}
.tcard:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(14,164,122,.12);transform:translateY(-1px)}
.tcard.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,164,122,.13)}
.tc-top{display:flex;align-items:center;gap:6px}
.tc-name{font-weight:700;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-stats{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted)}
.tc-stats b{color:var(--ink)}
.tc-champ{margin-top:8px;font-size:12px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:8px;padding:4px 9px;display:inline-block}
.tslot{
  border:1.5px dashed #cbd5e1;border-radius:12px;background:#fbfcfd;color:var(--muted);font-family:inherit;font-weight:600;
  font-size:13px;cursor:pointer;min-height:96px;transition:.15s
}
.tslot:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-soft)}

/* ---------- Choice grid ---------- */
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.choice-grid.two{grid-template-columns:1fr 1fr}
.choice{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 8px;border:1px solid var(--line);border-radius:12px;
  background:#fff;font-family:inherit;font-size:13px;font-weight:600;color:#334155;cursor:pointer;transition:.15s
}
.choice .ic{font-size:22px;line-height:1.1}
.choice small{font-size:10.5px;font-weight:500;color:var(--muted)}
.choice:hover{border-color:#cbd5e1;background:#f8fafc}
.choice.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);box-shadow:0 0 0 3px rgba(14,164,122,.12)}
.choice.full:not(.active){opacity:.55}
.choice:disabled{opacity:.4;cursor:not-allowed;background:#f8fafc}
.choice.g-male.active{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.choice.g-female.active{border-color:#ec4899;background:#fdf2f8;color:#be185d;box-shadow:0 0 0 3px rgba(236,72,153,.14)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;cursor:pointer}
.icon-pick{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ip{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:18px;cursor:pointer;transition:.12s}
.ip:hover{background:#f8fafc}
.ip.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(14,164,122,.12)}
.cur-t{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#f8fafc;border-radius:11px;margin-bottom:14px}

::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo"><div class="ball" id="brandIcon">⚽</div><div class="logo-text"><span id="brandName">Hội thao</span><small id="brandSub"></small></div></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-act="tab" data-tab="teams">Đội thi đấu</button>
      <button class="tab" data-act="tab" data-tab="groups">Vòng bảng</button>
      <button class="tab" data-act="tab" data-tab="schedule">Lịch thi đấu</button>
      <button class="tab" data-act="tab" data-tab="bracket">Nhánh đấu</button>
      <button class="tab" data-act="tab" data-tab="settings">Cài đặt</button>
    </nav>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn sm ghost" data-act="save-folder" title="Lưu dữ liệu vào file data.json trong thư mục">📁 Lưu vào thư mục</button>
      <button class="btn sm primary" data-act="export-excel-results" title="Xuất file Excel kết quả giải đấu & đội bóng">📊 Xuất Excel kết quả</button>
    </div>
  </div>
  <div class="ctxbar"><div class="cwrap" id="ctx"></div></div>
</header>

<main id="view"></main>

<script>
/* =========================================================
   STATE
   ========================================================= */
const LS_KEY = 'fagleague_v2';
const LS_KEY_OLD = 'fagleague_v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();

/* R = dữ liệu gốc (sự kiện, bộ môn, nhiều giải) · S = giải đang được mở */
let R = null, S = null;

const DEFAULT_SPORTS = [
  { id:'football',    name:'Bóng đá',     icon:'⚽' },
  { id:'volleyball',  name:'Bóng chuyền', icon:'🏐' },
  { id:'basketball',  name:'Bóng rổ',     icon:'🏀' },
  { id:'badminton',   name:'Cầu lông',    icon:'🏸' },
  { id:'tabletennis', name:'Bóng bàn',    icon:'🏓' },
  { id:'tugofwar',    name:'Kéo co',      icon:'🪢' }
];
const GENDERS = {
  male:   { label:'Nam', icon:'♂' },
  female: { label:'Nữ',  icon:'♀' }
};
const defaultSettings = () => ({ pointsWin: 3, pointsDraw: 1, qualifiers: 2 });
const sportOf = id => ((R && R.sports) || DEFAULT_SPORTS).find(s => s.id === id) || { id, name: id || 'Khác', icon: '🏅' };
const genderLabel = g => GENDERS[g]?.label || '';
function autoName(sportId, gender){
  return `Giải ${sportOf(sportId).name.toLowerCase()} ${genderLabel(gender).toLowerCase()}`.trim();
}
function makeTournament(sportId, gender, name){
  return { id: uid(), sportId, gender, name: name || autoName(sportId, gender),
    teams: [], groups: [], matches: [], settings: defaultSettings() };
}
function normTournament(t){
  const sportId = t.sportId || 'football';
  const gender = GENDERS[t.gender] ? t.gender : 'male';
  return {
    ...t, id: t.id || uid(), sportId, gender,
    name: t.name || autoName(sportId, gender),
    teams: Array.isArray(t.teams) ? t.teams : [],
    groups: Array.isArray(t.groups) ? t.groups : [],
    matches: Array.isArray(t.matches) ? t.matches : [],
    settings: { ...defaultSettings(), ...(t.settings || {}) }
  };
}
function defaultRoot(){
  const a = makeTournament('football', 'male'), b = makeTournament('football', 'female');
  return { version: 2, name: 'Hội thao UDA 2026', sports: DEFAULT_SPORTS.map(s => ({ ...s })),
    tournaments: [a, b], activeId: a.id, tab: 'teams' };
}
function normalizeRoot(p){
  if(!p || typeof p !== 'object') return defaultRoot();
  let sports, tournaments, name, activeId = p.activeId;
  if(Array.isArray(p.tournaments)){
    sports = (Array.isArray(p.sports) && p.sports.length ? p.sports : DEFAULT_SPORTS).map(s => ({ ...s }));
    tournaments = p.tournaments.map(normTournament);
    name = p.name || 'Hội thao';
  }else{
    // Dữ liệu cũ (1 giải duy nhất) → chuyển thành giải Bóng đá Nam
    sports = DEFAULT_SPORTS.map(s => ({ ...s }));
    tournaments = [normTournament({ sportId: 'football', gender: 'male', name: 'Giải bóng đá nam',
      teams: p.teams, groups: p.groups, matches: p.matches, settings: p.settings })];
    name = p.name || 'Hội thao UDA 2026';
  }
  tournaments.forEach(t => {
    if(!sports.some(s => s.id === t.sportId)) sports.push({ id: t.sportId, name: t.sportId, icon: '🏅' });
  });
  if(!tournaments.length) tournaments.push(makeTournament(sports[0]?.id || 'football', 'male'));
  if(!tournaments.some(t => t.id === activeId)) activeId = tournaments[0].id;
  return { version: 2, name, sports, tournaments, activeId, tab: p.tab || 'teams' };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LS_KEY_OLD);
    if(raw) return normalizeRoot(JSON.parse(raw));
  }catch(e){}
  return defaultRoot();
}
const activeT = () => R.tournaments.find(t => t.id === R.activeId) || R.tournaments[0];
function setRoot(p){ R = normalizeRoot(p); S = activeT(); }

/* Nhập dữ liệu: file nhiều giải → thay toàn bộ; file cũ 1 giải → nạp vào giải hiện tại */
function applyImported(p){
  if(p && Array.isArray(p.tournaments)){ setRoot(p); return 'all'; }
  Object.assign(S, {
    teams: Array.isArray(p.teams) ? p.teams : [],
    groups: Array.isArray(p.groups) ? p.groups : [],
    matches: Array.isArray(p.matches) ? p.matches : [],
    settings: { ...defaultSettings(), ...(p.settings || {}) }
  });
  return 'current';
}

R = load();
S = activeT();
let fileHandle = null;

async function writeToFileHandle(dataObj){
  if(!fileHandle) return false;
  try{
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(dataObj, null, 2));
    await writable.close();
    return true;
  }catch(e){
    console.warn('Cannot write to file handle', e);
    return false;
  }
}

const save = () => {
  localStorage.setItem(LS_KEY, JSON.stringify(R));
  if(fileHandle){
    writeToFileHandle(R);
  }
};

async function saveDataToFolder(){
  if('showSaveFilePicker' in window){
    try{
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'data.json',
        types: [{
          description: 'JSON File',
          accept: { 'application/json': ['.json'] }
        }]
      });
      const ok = await writeToFileHandle(R);
      if(ok){
        toast('Đã lưu dữ liệu vào thư mục & bật tự động đồng bộ!', 'ok');
        return;
      }
    }catch(err){
      if(err.name === 'AbortError') return;
    }
  }
  const blob = new Blob([JSON.stringify(R, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Đã tải file data.json (hãy lưu vào thư mục dự án)', 'ok');
}

async function loadDataFromFolder(){
  if('showOpenFilePicker' in window){
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{
          description: 'JSON File',
          accept: { 'application/json': ['.json'] }
        }]
      });
      const file = await handle.getFile();
      const text = await file.text();
      const p = JSON.parse(text);
      const scope = applyImported(p);
      fileHandle = scope === 'all' ? handle : null;
      save();
      render();
      toast(scope === 'all' ? 'Đã nạp dữ liệu từ file trong thư mục!' : `Đã nạp dữ liệu cũ vào "${S.name}"`, 'ok');
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
    }
  }
  document.getElementById('jsonInput')?.click();
}

const hasData = p => !!p && (((p.teams || []).length > 0) || ((p.groups || []).length > 0) ||
  (Array.isArray(p.tournaments) && p.tournaments.some(t => (t.teams || []).length || (t.groups || []).length)));

async function autoLoadFromFolderJson(){
  if(hasData(R)) return;
  try{
    const res = await fetch('./data.json');
    if(res.ok){
      const p = await res.json();
      if(p && typeof p === 'object' && hasData(p)){
        setRoot(p);
        save();
        render();
      }
    }
  }catch(e){}
}

let searchQ = '';
let fStage = 'all', fGroup = 'all', fStatus = 'all';

/* =========================================================
   HELPERS
   ========================================================= */
const teamName = id => { const t = S.teams.find(x => x.id === id); return t ? t.name : '—'; };
const groupName = id => { const g = S.groups.find(x => x.id === id); return g ? g.name : '—'; };
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function fmtDate(s){
  if(!s) return 'Chưa xếp';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function dayLabel(s){
  if(!s) return 'Chưa xếp ngày';
  const d = new Date(s + 'T00:00:00');
  const wd = ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][d.getDay()];
  return `${wd}, ${fmtDate(s)}`;
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date((dateStr||todayISO()) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function addMinutes(t, mins){
  const [h,m] = String(t||'08:00').split(':').map(Number);
  const total = h*60 + m + mins;
  return String(Math.floor(total/60)%24).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
}
function toast(msg, type){
  const d = document.createElement('div');
  d.className = 'toast ' + (type||'');
  d.textContent = msg;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ d.classList.remove('show'); setTimeout(()=>d.remove(), 300); }, 2600);
}

/* =========================================================
   MODAL
   ========================================================= */
function openModal({ title, body, footer, width }){
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal" style="max-width:${width||560}px">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer !== null ? `<div class="modal-foot">${footer || ''}</div>` : ''}
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', e => { if(e.target === ov) ov.remove(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', ()=>ov.remove()));
  return ov;
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const m = document.querySelector('.modal-overlay:last-child');
    if(m) m.remove();
  }
});

   TOURNAMENTS (bộ môn · giải nam / giải nữ)
   ========================================================= */
const SPORT_ICONS = ['⚽','🏐','🏀','🏸','🏓','🎾','🏈','⚾','🏑','🏒','🪢','♟️','🏃','🏊','🚴','🥋','🎯','🏹','🎱','🏅'];

function switchTournament(id){
  if(!R.tournaments.some(t => t.id === id)) return;
  R.activeId = id; S = activeT();
  searchQ = ''; fGroup = 'all';
  syncBracket(); save(); render();
}

function tournamentStats(t){
  const done = t.matches.filter(m => m.hs != null && m.as != null).length;
  const ko = t.matches.filter(m => m.stage === 'ko' && !m.thirdPlace);
  let champion = null;
  if(ko.length){
    const maxR = Math.max(...ko.map(m => m.round));
    const w = winnerOf(ko.find(m => m.round === maxR));
    if(w) champion = (t.teams.find(x => x.id === w) || {}).name || null;
  }
  return { teams: t.teams.length, groups: t.groups.length, matches: t.matches.length, done, champion };
}

const genderBadge = g => `<span class="gbadge ${g}">${GENDERS[g]?.icon || ''} ${esc(genderLabel(g))}</span>`;

function openTournamentModal(tid, preset, onDone){
  const editing = !!tid;
  const t = editing ? R.tournaments.find(x => x.id === tid) : null;
  if(editing && !t) return;
  const taken = (sp, g) => R.tournaments.some(x => x.sportId === sp && x.gender === g && x.id !== tid);
  const freeGender = sp => Object.keys(GENDERS).find(g => !taken(sp, g));

  let sportId = editing ? t.sportId : (preset?.sportId || S.sportId);
  let gender  = editing ? t.gender  : (preset?.gender  || S.gender || 'male');
  if(!editing && taken(sportId, gender)){
    const g = freeGender(sportId);
    if(g) gender = g;
    else{
      const sp = R.sports.find(s => freeGender(s.id));
      if(!sp) return toast('Tất cả bộ môn đã có đủ giải nam & nữ. Hãy thêm bộ môn mới.', 'err');
      sportId = sp.id; gender = freeGender(sp.id);
    }
  }
  let nameTouched = editing;

  const ov = openModal({
    title: editing ? 'Sửa giải đấu' : 'Tạo giải đấu mới',
    width: 620,
    body: `
      <div class="field"><span>Bộ môn</span><div class="choice-grid" id="t-sports"></div></div>
      <div class="field"><span>Nội dung</span><div class="choice-grid two" id="t-genders"></div></div>
      <label class="field"><span>Tên giải *</span>
        <input class="input" id="t-name" placeholder="VD: Giải bóng đá nam"></label>
      ${editing ? '' : `<label class="check"><input type="checkbox" id="t-copy" checked> Dùng cài đặt tính điểm của giải hiện tại (${esc(S.name)})</label>`}`,
    footer: `<button class="btn ghost" data-close>Hủy</button>
             <button class="btn primary" id="t-save">${editing ? 'Lưu thay đổi' : 'Tạo giải'}</button>`
  });
  const nameEl = ov.querySelector('#t-name');
  nameEl.value = editing ? t.name : autoName(sportId, gender);
  nameEl.addEventListener('input', () => nameTouched = true);

  const draw = () => {
    ov.querySelector('#t-sports').innerHTML = R.sports.map(s => {
      const full = !freeGender(s.id);
      return `<button type="button" class="choice ${s.id === sportId ? 'active' : ''} ${full ? 'full' : ''}" data-sp="${esc(s.id)}">
        <span class="ic">${esc(s.icon)}</span>${esc(s.name)}${full ? '<small>Đã đủ giải</small>' : ''}</button>`;
    }).join('');
    ov.querySelector('#t-genders').innerHTML = Object.entries(GENDERS).map(([k, g]) => {
      const dis = taken(sportId, k);
      return `<button type="button" class="choice g-${k} ${k === gender ? 'active' : ''}" data-g="${k}" ${dis ? 'disabled' : ''}>
        <span class="ic">${g.icon}</span>Giải ${g.label.toLowerCase()}${dis ? '<small>Đã có giải</small>' : ''}</button>`;
    }).join('');
    if(!nameTouched) nameEl.value = autoName(sportId, gender);
  };
  draw();

  ov.querySelector('#t-sports').addEventListener('click', e => {
    const b = e.target.closest('[data-sp]'); if(!b) return;
    sportId = b.dataset.sp;
    if(taken(sportId, gender)) gender = freeGender(sportId) || gender;
    draw();
  });
  ov.querySelector('#t-genders').addEventListener('click', e => {
    const b = e.target.closest('[data-g]'); if(!b || b.disabled) return;
    gender = b.dataset.g; draw();
  });
  ov.querySelector('#t-save').addEventListener('click', () => {
    const name = nameEl.value.trim();
    if(!name) return toast('Vui lòng nhập tên giải', 'err');
    if(taken(sportId, gender)) return toast(`${sportOf(sportId).name} đã có giải ${genderLabel(gender).toLowerCase()}`, 'err');
    if(editing){
      Object.assign(t, { name, sportId, gender });
      save(); render(); ov.remove();
      toast('Đã cập nhật giải đấu', 'ok');
    }else{
      const nt = makeTournament(sportId, gender, name);
      if(ov.querySelector('#t-copy')?.checked) nt.settings = { ...S.settings };
      R.tournaments.push(nt);
      ov.remove();
      switchTournament(nt.id);
      toast(`Đã tạo "${name}"`, 'ok');
    }
    onDone && onDone();
  });
}

function deleteTournament(id){
  const t = R.tournaments.find(x => x.id === id);
  if(!t) return false;
  if(R.tournaments.length <= 1){ toast('Cần giữ lại ít nhất 1 giải đấu', 'err'); return false; }
  if(!confirm(`Xóa "${t.name}"?\nToàn bộ ${t.teams.length} đội và ${t.matches.length} trận đấu của giải sẽ bị xóa vĩnh viễn.`)) return false;
  R.tournaments = R.tournaments.filter(x => x.id !== id);
  if(R.activeId === id) R.activeId = R.tournaments[0].id;
  S = activeT(); save(); render(); toast('Đã xóa giải đấu', 'ok');
  return true;
}

function openSportModal(onDone){
  let icon = '🏅';
  const ov = openModal({
    title: 'Thêm bộ môn',
    width: 480,
    body: `
      <label class="field"><span>Tên bộ môn *</span>
        <input class="input" id="sp-name" placeholder="VD: Cờ vua, Điền kinh, Pickleball..."></label>
      <div class="field"><span>Biểu tượng</span><div class="icon-pick" id="sp-icons"></div></div>`,
    footer: `<button class="btn ghost" data-close>Hủy</button><button class="btn primary" id="sp-save">Thêm bộ môn</button>`
  });
  const box = ov.querySelector('#sp-icons');
  const draw = () => box.innerHTML = SPORT_ICONS.map(i => `<button type="button" class="ip ${i === icon ? 'active' : ''}" data-i="${i}">${i}</button>`).join('');
  draw();
  box.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(b){ icon = b.dataset.i; draw(); } });
  ov.querySelector('#sp-name').focus();
  ov.querySelector('#sp-save').addEventListener('click', () => {
    const name = ov.querySelector('#sp-name').value.trim();
    if(!name) return toast('Vui lòng nhập tên bộ môn', 'err');
    if(R.sports.some(s => norm(s.name) === norm(name))) return toast('Bộ môn đã tồn tại', 'err');
    R.sports.push({ id: 'sp_' + uid(), name, icon });
    save(); ov.remove();
    toast(`Đã thêm bộ môn ${name}`, 'ok');
    onDone && onDone();
  });
}

function openManageModal(){
  const ov = openModal({
    title: 'Quản lý bộ môn & giải đấu',
    width: 820,
    body: `<div id="mg-body"></div>`,
    footer: `<button class="btn ghost" data-mg="add-sport">+ Thêm bộ môn</button>
             <div class="spacer"></div>
             <button class="btn ghost" data-close>Đóng</button>
             <button class="btn primary" data-mg="add-t">+ Tạo giải mới</button>`
  });
  const box = ov.querySelector('#mg-body');
  const draw = () => {
    const all = R.tournaments.map(tournamentStats);
    const sum = k => all.reduce((a, s) => a + s[k], 0);
    const usedSports = R.sports.filter(sp => R.tournaments.some(t => t.sportId === sp.id)).length;
    box.innerHTML = `
      <div class="mg-stats">
        <div><b>${usedSports}</b><span>Bộ môn</span></div>
        <div><b>${R.tournaments.length}</b><span>Giải đấu</span></div>
        <div><b>${sum('teams')}</b><span>Đội tham gia</span></div>
        <div><b>${sum('done')}/${sum('matches')}</b><span>Trận đã đá</span></div>
      </div>
      ${R.sports.map(sp => {
        const ts = R.tournaments.filter(t => t.sportId === sp.id);
        return `<section class="sport-sec">
          <div class="sport-head">
            <span class="sport-ic">${esc(sp.icon)}</span>
            <h4>${esc(sp.name)}</h4>
            <span class="muted small">${ts.length ? ts.length + ' giải' : 'Chưa có giải'}</span>
            <span class="spacer"></span>
            ${!ts.length ? `<button class="icon-btn" data-mg="del-sport" data-id="${esc(sp.id)}" title="Xóa bộ môn">🗑️</button>` : ''}
          </div>
          <div class="tgrid">
            ${Object.keys(GENDERS).map(g => {
              const t = ts.find(x => x.gender === g);
              if(!t) return `<button class="tslot" data-mg="new-t" data-sport="${esc(sp.id)}" data-gender="${g}">+ Tạo giải ${genderLabel(g).toLowerCase()}</button>`;
              const st = tournamentStats(t);
              return `<div class="tcard ${t.id === S.id ? 'active' : ''}" data-mg="open-t" data-id="${t.id}" title="Mở giải này">
                <div class="tc-top">${genderBadge(g)}${t.id === S.id ? '<span class="badge">Đang mở</span>' : ''}<span class="spacer"></span>
                  <button class="icon-btn" data-mg="edit-t" data-id="${t.id}" title="Sửa">✏️</button>
                  <button class="icon-btn" data-mg="del-t" data-id="${t.id}" title="Xóa">🗑️</button>
                </div>
                <div class="tc-name">${esc(t.name)}</div>
                <div class="tc-stats"><span><b>${st.teams}</b> đội</span><span><b>${st.groups}</b> bảng</span><span><b>${st.done}/${st.matches}</b> trận</span></div>
                ${st.champion ? `<div class="tc-champ">🏆 ${esc(st.champion)}</div>` : ''}
              </div>`;
            }).join('')}
          </div>
        </section>`;
      }).join('')}`;
  };
  draw();

  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-mg]'); if(!b) return;
    const act = b.dataset.mg, id = b.dataset.id;
    if(act === 'open-t'){ ov.remove(); if(id !== S.id) switchTournament(id); }
    else if(act === 'edit-t') openTournamentModal(id, null, draw);
    else if(act === 'del-t'){ if(deleteTournament(id)) draw(); }
    else if(act === 'new-t'){ ov.remove(); openTournamentModal(null, { sportId: b.dataset.sport, gender: b.dataset.gender }); }
    else if(act === 'add-t'){ ov.remove(); openTournamentModal(null); }
    else if(act === 'add-sport') openSportModal(draw);
    else if(act === 'del-sport'){
      const sp = R.sports.find(s => s.id === id);
      if(sp && confirm(`Xóa bộ môn "${sp.name}"?`)){
        R.sports = R.sports.filter(s => s.id !== id);
        save(); render(); draw();
      }
    }
  });
}

          <input class="input" id="f-name" value="${esc(t.name)}" placeholder="VD: FC Sao Đêm"></label>
        <label class="field"><span>Đội trưởng (tv1) *</span>
          <input class="input" id="f-captain" value="${esc(t.captain)}" placeholder="Nguyễn Văn A (tv1)"></label>
      </div>
      <label class="field"><span>Số điện thoại</span>
        <input class="input" id="f-phone" value="${esc(t.phone)}" placeholder="09xx xxx xxx"></label>
      <div class="field">
        <span>Thành viên <em>(tối đa 9 người, chưa tính đội trưởng — tổng cộng 10: tv1 đến tv10)</em></span>
        <div id="memberList"></div>
        <button class="btn ghost sm" id="addMember" type="button" style="align-self:flex-start">+ Thêm thành viên</button>
      </div>`,
    footer: `<button class="btn ghost" data-close>Hủy</button>
             <button class="btn primary" id="saveTeam">${editing?'Lưu thay đổi':'Thêm đội'}</button>`
  });

  const list = ov.querySelector('#memberList');
  const renderMembers = () => {
    list.innerHTML = members.map((m,i)=>`
      <div class="member-row">
        <input class="input" data-mi="${i}" value="${esc(m)}" placeholder="Thành viên ${i+2} (tv${i+2})">
        <button class="icon-btn" type="button" data-mdel="${i}">✕</button>
      </div>`).join('') || `<div class="muted small" style="padding:4px 0 8px">Chưa có thành viên nào</div>`;
    ov.querySelector('#addMember').style.display = members.length >= 9 ? 'none' : '';
  };
  renderMembers();

  list.addEventListener('input', e => {
    const i = e.target.dataset.mi;
    if(i !== undefined) members[+i] = e.target.value;
  });
  list.addEventListener('click', e => {
    const i = e.target.dataset.mdel;
    if(i !== undefined){ members.splice(+i,1); renderMembers(); }
  });
  ov.querySelector('#addMember').addEventListener('click', () => {
    if(members.length >= 9) return;
    members.push(''); renderMembers();
    const inputs = list.querySelectorAll('input');
    inputs[inputs.length-1]?.focus();
  });

  ov.querySelector('#saveTeam').addEventListener('click', () => {
    const name = ov.querySelector('#f-name').value.trim();
    const captain = ov.querySelector('#f-captain').value.trim();
    const phone = ov.querySelector('#f-phone').value.trim();
    if(!name) return toast('Vui lòng nhập tên đội bóng', 'err');
    if(!captain) return toast('Vui lòng nhập tên đội trưởng', 'err');
    const dup = S.teams.find(x => x.id !== t.id && norm(x.name) === norm(name));
    if(dup) return toast('Tên đội bóng đã tồn tại', 'err');

    const clean = members.map(m=>m.trim()).filter(Boolean).slice(0,9);
    if(editing){
      Object.assign(t, { name, captain, phone, members: clean });
    }else{
      S.teams.push({ id: t.id, name, captain, phone, members: clean });
    }
    save(); render(); ov.remove();
    toast(editing ? 'Đã cập nhật đội bóng' : 'Đã thêm đội bóng', 'ok');
  });
}

function deleteTeam(id){
  const t = S.teams.find(x=>x.id===id);
  if(!t) return;
  const used = S.matches.some(m => m.homeId===id || m.awayId===id);
  const msg = used
    ? `Đội "${t.name}" đang có trận đấu. Xóa sẽ gỡ đội khỏi bảng đấu và xóa các trận liên quan. Tiếp tục?`
    : `Xóa đội "${t.name}"?`;
  if(!confirm(msg)) return;
  S.teams = S.teams.filter(x=>x.id!==id);
  S.groups.forEach(g => g.teamIds = g.teamIds.filter(x=>x!==id));
  S.matches = S.matches.filter(m => m.homeId!==id && m.awayId!==id);
  save(); render(); toast('Đã xóa đội bóng', 'ok');
}

function importExcel(file){
  if(typeof XLSX === 'undefined'){
    return toast('Thư viện Excel chưa tải được. Kiểm tra kết nối mạng rồi thử lại.', 'err');
  }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if(!rows.length) return toast('File không có dữ liệu', 'err');

      // detect header
      const first = rows[0].map(c => norm(c));
      const hasHeader = first.some(c => c.includes('ten doi') || c.includes('team') || c.includes('doi bong') || c.includes('tv1') || c.includes('tv 1'));
      const headerRow = hasHeader ? first : null;
      const dataRows = hasHeader ? rows.slice(1) : rows;

      let idx = { name: 0, captain: 1, phone: 2, members: [] };
      if(hasHeader){
        idx = { name: -1, captain: -1, phone: -1, members: [] };
        headerRow.forEach((h, i) => {
          if(idx.name < 0 && (h.includes('ten doi') || h.includes('doi bong') || h === 'team' || h === 'doi')) idx.name = i;
          else if(idx.captain < 0 && (h.includes('doi truong') || h.includes('captain') || h.includes('truong') || h.includes('tv1') || h.includes('tv 1') || /^tv\s*1\b/.test(h))) idx.captain = i;
          else if(idx.phone < 0 && (h.includes('sdt') || h.includes('phone') || h.includes('dien thoai') || h.includes('so dt'))) idx.phone = i;
          else if(h.includes('thanh vien') || h.includes('cau thu') || h.includes('member') || h.includes('player') || /^tv\s*\d+$/.test(h) || /^tv\d+$/.test(h)) idx.members.push(i);
        });
        if(idx.name < 0) idx.name = 0;
        if(idx.captain < 0) idx.captain = 1;
        if(idx.phone < 0) idx.phone = 2;
        if(!idx.members.length) idx.members = headerRow.map((_,i)=>i).filter(i => i !== idx.name && i !== idx.captain && i !== idx.phone);
      }else{
        idx.members = [];
        for(let i=3;i<Math.max(...dataRows.map(r=>r.length));i++) idx.members.push(i);
      }

      const parsed = [];
      dataRows.forEach(r => {
        const name = String(r[idx.name] ?? '').trim();
        if(!name) return;
        const captain = String(r[idx.captain] ?? '').trim();
        const phone = String(r[idx.phone] ?? '').trim();
        const members = [];
        idx.members.forEach(i => {
          String(r[i] ?? '').split(/[,;\/|]/).forEach(p => {
            const v = p.trim();
            if(v && members.length < 9) members.push(v);
          });
        });
        parsed.push({ name, captain, phone, members });
      });

      if(!parsed.length) return toast('Không đọc được đội bóng nào', 'err');

      const existing = new Set(S.teams.map(t => norm(t.name)));
      const fresh = parsed.filter(p => !existing.has(norm(p.name)));
      const skipped = parsed.length - fresh.length;

      const ov = openModal({
        title: `Nhập Excel vào "${S.name}" (${fresh.length} đội)`,
        width: 660,
        body: `
          ${skipped ? `<div class="badge gray" style="margin-bottom:12px">Bỏ qua ${skipped} đội trùng tên</div>` : ''}
          <table class="table">
            <thead><tr><th>Đội bóng</th><th>Đội trưởng</th><th>SĐT</th><th>Thành viên</th></tr></thead>
            <tbody>${fresh.map(p=>`<tr>
              <td class="tname">${esc(p.name)}</td>
              <td>${esc(p.captain||'—')}</td>
              <td>${esc(p.phone||'—')}</td>
              <td class="muted small">${esc(p.members.join(', ')||'—')}</td>
            </tr>`).join('')}</tbody>
          </table>`,
        footer: `<button class="btn ghost" data-close>Hủy</button>
                 <button class="btn primary" id="doImport" ${fresh.length?'':'disabled'}>Nhập ${fresh.length} đội</button>`
      });

      ov.querySelector('#doImport').addEventListener('click', () => {
        fresh.forEach(p => S.teams.push({ id: uid(), ...p }));
        save(); render(); ov.remove();
        toast(`Đã nhập ${fresh.length} đội bóng`, 'ok');
      });
    }catch(err){
      console.error(err);
      toast('Lỗi đọc file. Kiểm tra định dạng file.', 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportExcelResults(){
  if(typeof XLSX === 'undefined'){
    return toast('Thư viện Excel chưa tải được. Kiểm tra kết nối mạng rồi thử lại.', 'err');
  }

  const wb = XLSX.utils.book_new();

  // Tiêu đề chung ở đầu mỗi sheet: tên sự kiện, tên giải, bộ môn, nội dung
  const sp = sportOf(S.sportId);
  const meta = [
    [(R.name || '').toUpperCase()],
    [`Giải: ${S.name}`],
    [`Bộ môn: ${sp.name}  ·  Nội dung: ${genderLabel(S.gender)}  ·  Ngày xuất: ${fmtDate(todayISO())}`],
    []
  ];
  const buildSheet = rows => {
    const ncol = Math.max(1, ...rows.map(r => r.length));
    const ws = XLSX.utils.aoa_to_sheet([...meta, ...rows]);
    ws['!merges'] = [0, 1, 2, meta.length].map(r => ({ s: { r, c: 0 }, e: { r, c: ncol - 1 } }));
    return ws;
  };

  // Sheet 1: Bảng Xếp Hạng Vòng Bảng
  const stHead = ['BẢNG XẾP HẠNG VÒNG BẢNG'];
  const stCols = ['STT', 'Bảng đấu', 'Tên đội bóng', 'Đội trưởng', 'Số điện thoại', 'Trận', 'Thắng', 'Hòa', 'Thua', 'BT', 'BB', 'HS', 'Điểm'];
  const stRows = [stHead, stCols];
  
  if(S.groups.length > 0){
    S.groups.forEach(g => {
      const st = computeStandings(g.id);
      st.forEach((r, idx) => {
        const t = S.teams.find(x => x.id === r.id);
        stRows.push([
          idx + 1,
          g.name,
          teamName(r.id),
          t?.captain || '—',
          t?.phone || '—',
          r.p, r.w, r.d, r.l, r.gf, r.ga, (r.gd > 0 ? '+' : '') + r.gd, r.pts
        ]);
      });
    });
  } else {
    stRows.push(['Chưa có bảng đấu nào']);
  }
  const wsSt = buildSheet(stRows);
  wsSt['!cols'] = [{wch:6}, {wch:12}, {wch:22}, {wch:18}, {wch:14}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:10}];
  XLSX.utils.book_append_sheet(wb, wsSt, 'Bang Xep Hang');

  // Sheet 2: Thống Kê Chi Tiết Đội Bóng
  const tsHead = ['KẾT QUẢ & THỐNG KÊ CHI TIẾT ĐỘI BÓNG'];
  const tsCols = ['STT', 'Tên đội bóng', 'Đội trưởng', 'Số điện thoại', 'Số TV', 'Bảng đấu', 'Tổng trận', 'Thắng', 'Hòa', 'Thua', 'BT', 'BB', 'HS', 'Vàng', 'Đỏ', 'Kết quả / Vị trí'];
  const tsRows = [tsHead, tsCols];

  const getTeamTOResult = (teamId) => {
    const koMatches = S.matches.filter(m => m.stage === 'ko' && (m.homeId === teamId || m.awayId === teamId));
    if(!koMatches.length) return 'Vòng bảng';
    const finalMatch = S.matches.find(m => m.stage === 'ko' && !m.thirdPlace && m.round === Math.max(...S.matches.filter(x=>x.stage==='ko').map(x=>x.round)));
    if(finalMatch && finalMatch.hs != null && finalMatch.as != null){
      const w = winnerOf(finalMatch);
      if(w === teamId) return '🏆 VÔ ĐỊCH';
      if(w && (finalMatch.homeId === teamId || finalMatch.awayId === teamId)) return '🥈 Á QUÂN';
    }
    const thirdMatch = S.matches.find(m => m.thirdPlace);
    if(thirdMatch && thirdMatch.hs != null && thirdMatch.as != null){
      const w = winnerOf(thirdMatch);
      if(w === teamId) return '🥉 HẠNG 3';
      if(w && (thirdMatch.homeId === teamId || thirdMatch.awayId === teamId)) return 'HẠNG 4';
    }
    const maxRoundTeam = Math.max(...koMatches.map(m=>m.round));
    const roundMatch = koMatches.find(m => m.round === maxRoundTeam);
    return roundMatch ? (roundMatch.roundName || 'Vòng knock-out') : '—';
  };

  S.teams.forEach((t, i) => {
    const teamGroup = S.groups.find(g => g.teamIds.includes(t.id));
    const teamMatches = S.matches.filter(m => (m.homeId === t.id || m.awayId === t.id) && m.hs != null && m.as != null);
    let p=0, w=0, d=0, l=0, gf=0, ga=0, y=0, r=0;
    teamMatches.forEach(m => {
      p++;
      const isHome = m.homeId === t.id;
      const myScore = isHome ? m.hs : m.as;
      const oppScore = isHome ? m.as : m.hs;
      gf += myScore;
      ga += oppScore;
      y += isHome ? (m.hy||0) : (m.ay||0);
      r += isHome ? (m.hr||0) : (m.ar||0);
      const winId = winnerOf(m);
      if(winId === t.id) w++;
      else if(winId === null && myScore === oppScore) d++;
      else l++;
    });
    tsRows.push([
      i + 1,
      t.name,
      t.captain || '—',
      t.phone || '—',
      (t.members || []).length + 1,
      teamGroup ? teamGroup.name : '—',
      p, w, d, l, gf, ga, (gf - ga > 0 ? '+' : '') + (gf - ga), y, r,
      getTeamTOResult(t.id)
    ]);
  });
  const wsTs = buildSheet(tsRows);
  wsTs['!cols'] = [{wch:6}, {wch:22}, {wch:18}, {wch:14}, {wch:8}, {wch:12}, {wch:10}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:8}, {wch:10}, {wch:10}, {wch:20}];
  XLSX.utils.book_append_sheet(wb, wsTs, 'Thong Ke Doi Bong');

  // Sheet 3: Danh Sách & Kết Quả Trận Đấu
  const mHead = ['DANH SÁCH VÀ KẾT QUẢ CÁC TRẬN ĐẤU'];
  const mCols = ['STT', 'Giai đoạn', 'Vòng / Bảng', 'Ngày', 'Giờ', 'Sân', 'Đội nhà', 'Tỉ số', 'Đội khách', 'Đội thắng', 'Luân lưu', 'Thẻ vàng', 'Thẻ đỏ', 'Cầu thủ xuất sắc (MVP)', 'Trọng tài', 'Ghi chú', 'Trạng thái'];
  const mRows = [mHead, mCols];

  S.matches.forEach((m, idx) => {
    const done = m.hs != null && m.as != null;
    const h = teamName(m.homeId), a = teamName(m.awayId);
    const winId = winnerOf(m);
    const winName = winId ? teamName(winId) : (done ? 'Hòa' : '—');
    const stageName = m.stage === 'group' ? 'Vòng bảng' : 'Loại trực tiếp';
    const subName = m.groupId ? groupName(m.groupId) : (m.roundName || '');
    const penStr = (m.hp != null && m.ap != null) ? `${m.hp} - ${m.ap}` : '—';
    const yellowStr = `${m.hy||0} - ${m.ay||0}`;
    const redStr = `${m.hr||0} - ${m.ar||0}`;

    mRows.push([
      idx + 1,
      stageName,
      subName,
      m.date ? fmtDate(m.date) : 'Chưa xếp',
      m.time || '—',
      m.pitch || '—',
      h,
      done ? `${m.hs} - ${m.as}` : 'Chưa đá',
      a,
      winName,
      penStr,
      yellowStr,
      redStr,
      m.mvp || '—',
      m.referee || '—',
      m.note || '—',
      done ? 'Đã kết thúc' : 'Chưa thi đấu'
    ]);
  });
  const wsM = buildSheet(mRows);
  wsM['!cols'] = [{wch:6}, {wch:14}, {wch:14}, {wch:12}, {wch:8}, {wch:10}, {wch:20}, {wch:10}, {wch:20}, {wch:20}, {wch:12}, {wch:10}, {wch:10}, {wch:20}, {wch:16}, {wch:24}, {wch:14}];
  XLSX.utils.book_append_sheet(wb, wsM, 'Ket Qua Tran Dau');

  // Sheet 4: Danh Sách Đội & Cầu Thủ
  const rHead = ['DANH SÁCH CÁC ĐỘI BÓNG VÀ CẦU THỦ (TV1: ĐỘI TRƯỞNG, TV2 - TV10: THÀNH VIÊN)'];
  const rCols = ['STT', 'Tên đội bóng', 'tv1 (Đội trưởng)', 'Số điện thoại', 'tv2', 'tv3', 'tv4', 'tv5', 'tv6', 'tv7', 'tv8', 'tv9', 'tv10'];
  const rRows = [rHead, rCols];

  S.teams.forEach((t, idx) => {
    const mems = t.members || [];
    rRows.push([
      idx + 1,
      t.name,
      t.captain || '—',
      t.phone || '—',
      mems[0] || '', mems[1] || '', mems[2] || '', mems[3] || '', mems[4] || '', mems[5] || '', mems[6] || '', mems[7] || '', mems[8] || ''
    ]);
  });
  const wsR = buildSheet(rRows);
  wsR['!cols'] = [{wch:6}, {wch:22}, {wch:18}, {wch:14}, {wch:16}, {wch:16}, {wch:16}, {wch:16}, {wch:16}, {wch:16}, {wch:16}, {wch:16}, {wch:16}];
  XLSX.utils.book_append_sheet(wb, wsR, 'Danh Sach Doi & Cau Thu');

  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  const fileName = `Ket_qua_${slug(S.name) || 'giai_dau'}_${todayISO()}.xlsx`;
  XLSX.writeFile(wb, fileName);
  toast(`Đã xuất Excel kết quả: ${S.name}`, 'ok');
}

function autoGroups(){
  if(S.teams.length < 2) return toast('Cần ít nhất 2 đội bóng', 'err');
  const ov = openModal({
    title: 'Chia bảng tự động',
    body: `
      <label class="field"><span>Số bảng</span>
        <input class="input" type="number" id="g-count" min="1" max="8" value="${S.groups.length || 2}"></label>
      <label class="field"><span>Cách chia</span>
        <select class="input" id="g-mode">
          <option value="order">Theo thứ tự danh sách đội</option>
          <option value="random">Ngẫu nhiên</option>
        </select></label>
      <p class="muted small">Đội được chia theo kiểu "rắn cuốn" để các bảng cân bằng nhất có thể.</p>`,
    footer: `<button class="btn ghost" data-close>Hủy</button><button class="btn primary" id="doAuto">Chia bảng</button>`
  });
  ov.querySelector('#doAuto').addEventListener('click', () => {
    const n = Math.max(1, Math.min(8, +ov.querySelector('#g-count').value || 2));
    const mode = ov.querySelector('#g-mode').value;
    let teams = S.teams.slice();
    if(mode === 'random') teams.sort(()=>Math.random()-0.5);

    const letters = 'ABCDEFGH';
    S.groups = Array.from({length:n}, (_,i)=>({ id: uid(), name: 'Bảng ' + letters[i], teamIds: [] }));
    teams.forEach((t, i) => {
      const round = Math.floor(i / n);
      const pos = round % 2 === 0 ? i % n : n - 1 - (i % n);
      S.groups[pos].teamIds.push(t.id);
    });
    // xóa lịch vòng bảng cũ
    S.matches = S.matches.filter(m => m.stage !== 'group');
    save(); render(); ov.remove();
    toast('Đã chia bảng', 'ok');
  });
}

function computeStandings(groupId){
  const g = S.groups.find(x=>x.id===groupId);
  if(!g) return [];
  const map = {};
  g.teamIds.forEach(id => map[id] = { id, p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,y:0,r:0 });
  S.matches
    .filter(m => m.stage==='group' && m.groupId===groupId && m.hs!=null && m.as!=null)
    .forEach(m => {
      const h = map[m.homeId], a = map[m.awayId];
      if(!h || !a) return;
      h.p++; a.p++;
      h.gf += m.hs; h.ga += m.as;
      a.gf += m.as; a.ga += m.hs;
      if(m.hs > m.as){ h.w++; a.l++; h.pts += S.settings.pointsWin; }
      else if(m.hs < m.as){ a.w++; h.l++; a.pts += S.settings.pointsWin; }
      else { h.d++; a.d++; h.pts += S.settings.pointsDraw; a.pts += S.settings.pointsDraw; }
      h.y += m.hy||0; a.y += m.ay||0; h.r += m.hr||0; a.r += m.ar||0;
    });
  return Object.values(map).map(r => ({ ...r, gd: r.gf - r.ga }))
    .sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || teamName(a.id).localeCompare(teamName(b.id)));
}

function roundRobin(ids){
  const arr = ids.slice();
  if(arr.length % 2) arr.push(null);
  const n = arr.length;
  const rounds = [];
  for(let r=0; r<n-1; r++){
    const pairs = [];
    for(let i=0; i<n/2; i++){
      const a = arr[i], b = arr[n-1-i];
      if(a && b) pairs.push(r % 2 === 0 ? [a,b] : [b,a]);
    }
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());
  }
  return rounds;
}

/* =========================================================
   KNOCKOUT
   ========================================================= */
function seedOrder(n){
  let arr = [1];
  while(arr.length < n){
    const m = arr.length * 2;
    const next = [];
    arr.forEach(s => { next.push(s); next.push(m + 1 - s); });
    arr = next;
  }
  return arr;
}

function winnerOf(m){
  if(!m || m.hs == null || m.as == null || !m.homeId || !m.awayId) return null;
  if(m.hs > m.as) return m.homeId;
  if(m.as > m.hs) return m.awayId;
  if(m.hp != null && m.ap != null && m.hp !== m.ap) return m.hp > m.ap ? m.homeId : m.awayId;
  return null;
}
function loserOf(m){
  if(!m || m.hs == null || m.as == null || !m.homeId || !m.awayId) return null;
  if(m.hs > m.as) return m.awayId;
  if(m.as > m.hs) return m.homeId;
  if(m.hp != null && m.ap != null && m.hp !== m.ap) return m.hp > m.ap ? m.awayId : m.homeId;
  return null;
}

function getSeeds(){
  const per = S.settings.qualifiers;
  const out = [];
  for(let r=0; r<per; r++){
    S.groups.forEach(g => {
      const st = computeStandings(g.id);
      if(st[r]) out.push(st[r].id);
    });
  }
  return out;
}

function groupStageComplete(){
  const gm = S.matches.filter(m => m.stage === 'group');
  return gm.length > 0 && gm.every(m => m.hs != null && m.as != null);
}

function generateKnockout(){
  const seeds = getSeeds();
  const n = seeds.length;
  if(n < 2) return toast('Chưa đủ đội đi tiếp', 'err');
  if((n & (n-1)) !== 0) return toast(`Số đội đi tiếp hiện tại là ${n}. Cần là 4, 8 hoặc 16 — hãy chỉnh "Số đội đi tiếp mỗi bảng" trong Cài đặt.`, 'err');
  if(!groupStageComplete()){
    if(!confirm('Vòng bảng chưa hoàn tất. Vẫn tạo nhánh đấu theo thứ tự hiện tại?')) return;
  }

  S.matches = S.matches.filter(m => m.stage !== 'ko');

  const names = [];
  const label = { 16: 'Vòng 1/8', 8: 'Tứ kết', 4: 'Bán kết', 2: 'Chung kết' };
  let sz = n;
  while(sz >= 2){ names.push(label[sz] || ('Vòng ' + sz)); sz /= 2; }

  const rounds = [];
  for(let r=0; r<names.length; r++){
    const cnt = n / Math.pow(2, r+1);
    const arr = [];
    for(let i=0; i<cnt; i++){
      arr.push({
        id: uid(), stage: 'ko', round: r, roundName: names[r], slot: i,
        homeId: null, awayId: null, hs: null, as: null, hp: null, ap: null,
        hy: 0, ay: 0, hr: 0, ar: 0, date: '', time: '', pitch: '',
        mvp: '', referee: '', note: ''
      });
    }
    rounds.push(arr);
  }

  const order = seedOrder(n);
  for(let i=0; i<n/2; i++){
    rounds[0][i].homeId = seeds[order[2*i] - 1];
    rounds[0][i].awayId = seeds[order[2*i+1] - 1];
  }

  for(let r=0; r<names.length-1; r++){
    rounds[r].forEach((m, i) => {
      m.nextId = rounds[r+1][Math.floor(i/2)].id;
      m.nextSlot = i % 2;
    });
  }

  // Tranh hạng 3
  if(names.length >= 2){
    const semiRound = rounds[names.length - 2];
    const third = {
      id: uid(), stage: 'ko', round: names.length - 1, roundName: 'Tranh hạng 3',
      slot: 99, thirdPlace: true,
      homeId: null, awayId: null, hs: null, as: null, hp: null, ap: null,
      hy: 0, ay: 0, hr: 0, ar: 0, date: '', time: '', pitch: '', mvp: '', referee: '', note: ''
    };
    semiRound.forEach((m, i) => { m.loserNextId = third.id; m.loserSlot = i; });
    rounds[rounds.length - 1].push(third);
  }

  rounds.flat().forEach(m => S.matches.push(m));
  syncBracket();
  save(); render();
  toast('Đã tạo nhánh đấu loại trực tiếp', 'ok');
}

function syncBracket(){
  const ko = S.matches.filter(m => m.stage === 'ko');
  if(!ko.length) return;
  ko.sort((a,b) => (a.round - b.round) || (a.slot - b.slot));

  const before = {};
  ko.forEach(m => before[m.id] = (m.homeId||'') + '|' + (m.awayId||''));

  // xoá các suất được suy ra
  ko.forEach(m => {
    if(m.thirdPlace){ m.homeId = null; m.awayId = null; }
    else if(m.round > 0){ m.homeId = null; m.awayId = null; }
  });

  // lan truyền
  ko.forEach(m => {
    const w = winnerOf(m), l = loserOf(m);
    if(m.nextId){
      const nx = S.matches.find(x => x.id === m.nextId);
      if(nx) nx[m.nextSlot === 0 ? 'homeId' : 'awayId'] = w;
    }
    if(m.loserNextId){
      const nx = S.matches.find(x => x.id === m.loserNextId);
      if(nx) nx[m.loserSlot === 0 ? 'homeId' : 'awayId'] = l;
    }
  });

  // nếu đội thay đổi → xoá tỉ số cũ của trận đó
  ko.forEach(m => {
    const now = (m.homeId||'') + '|' + (m.awayId||'');
    if(before[m.id] !== now && m.round > 0){
      m.hs = null; m.as = null; m.hp = null; m.ap = null;
      m.hy = 0; m.ay = 0; m.hr = 0; m.ar = 0;
    }
    if(before[m.id] !== now && m.thirdPlace){
      m.hs = null; m.as = null; m.hp = null; m.ap = null;
    }
  });
}

/* ----- Lịch thi đấu ----- */
function viewSchedule(){
  if(!S.matches.length){
    return emptyState('📅', 'Chưa có trận đấu nào',
      'Hãy chia bảng và tạo lịch thi đấu vòng bảng, hoặc tạo nhánh đấu loại trực tiếp.',
      `<button class="btn primary" data-act="tab" data-tab="groups">Đi tới Vòng bảng</button>`);
  }

  let list = S.matches.slice();
  if(fStage !== 'all') list = list.filter(m => fStage === 'group' ? m.stage === 'group' : m.stage === 'ko');
  if(fGroup !== 'all') list = list.filter(m => m.groupId === fGroup);
  if(fStatus !== 'all') list = list.filter(m => {
    const done = m.hs != null && m.as != null;
    return fStatus === 'done' ? done : !done;
  });

  list.sort((a,b) => {
    const da = a.date || '9999-99-99', db = b.date || '9999-99-99';
    if(da !== db) return da < db ? -1 : 1;
    return (a.time || '').localeCompare(b.time || '');
  });

  // group by date
  const byDate = {};
  list.forEach(m => {
    const k = m.date || '';
    (byDate[k] = byDate[k] || []).push(m);
  });

  const koRounds = [...new Set(S.matches.filter(m => m.stage === 'ko').map(m => m.roundName))];

  return `
  <div class="page-head">
    <div>
      <h1>Lịch thi đấu</h1>
      <p class="muted">${S.matches.length} trận · ${S.matches.filter(m=>m.hs!=null&&m.as!=null).length} đã có kết quả</p>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="save-folder">📁 Lưu vào thư mục</button>
      <button class="btn primary" data-act="export-excel-results">📊 Xuất Excel kết quả</button>
    </div>
  </div>

  <div class="toolbar">
    <select class="input" style="max-width:190px" data-act="f-stage">
      <option value="all" ${fStage==='all'?'selected':''}>Tất cả giai đoạn</option>
      <option value="group" ${fStage==='group'?'selected':''}>Vòng bảng</option>
      <option value="ko" ${fStage==='ko'?'selected':''}>Loại trực tiếp</option>
    </select>
    <select class="input" style="max-width:190px" data-act="f-group">
      <option value="all" ${fGroup==='all'?'selected':''}>Tất cả bảng</option>
      ${S.groups.map(g => `<option value="${g.id}" ${fGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
    </select>
    <select class="input" style="max-width:190px" data-act="f-status">
      <option value="all" ${fStatus==='all'?'selected':''}>Mọi trạng thái</option>
      <option value="todo" ${fStatus==='todo'?'selected':''}>Chưa đá</option>
      <option value="done" ${fStatus==='done'?'selected':''}>Đã kết thúc</option>
    </select>
  </div>

  ${!list.length
    ? emptyState('🔍', 'Không có trận đấu phù hợp', 'Thử đổi bộ lọc xem sao.')
    : Object.keys(byDate).sort((a,b)=> (a||'9999')<(b||'9999')?-1:1).map(date => `
        <div class="day-group">
          <div class="day-head"><span>${esc(dayLabel(date))}</span><span class="line"></span>
            <span class="muted small">${byDate[date].length} trận</span></div>
          ${byDate[date].map(matchRow).join('')}
        </div>`).join('')}
  `;
}

function matchRow(m){
  const done = m.hs != null && m.as != null;
  const h = teamName(m.homeId), a = teamName(m.awayId);
  const hw = done && (winnerOf(m) === m.homeId);
  const aw = done && (winnerOf(m) === m.awayId);
  const hasCards = (m.hy||0)+(m.ay||0)+(m.hr||0)+(m.ar||0) > 0;

  return `<div class="match" data-act="score" data-id="${m.id}">
    <div class="m-top">
      <span class="badge">${esc(m.roundName || '')}</span>
      ${m.groupId ? `<span class="badge soft">${esc(groupName(m.groupId))}</span>` : ''}
      ${done ? `<span class="badge done">Đã đá</span>` : `<span class="badge live">Chưa đá</span>`}
      <span class="spacer"></span>
      <span class="muted small">${m.time ? '⏰ ' + m.time : ''}${m.pitch ? ' · 📍 ' + esc(m.pitch) : ''}</span>
    </div>
    <div class="m-mid">
      <div class="m-team home ${hw?'win':''}">${esc(h)}</div>
      <div class="m-score ${done?'done':''}">${done ? `${m.hs} - ${m.as}` : 'vs'}</div>
      <div class="m-team away ${aw?'win':''}">${esc(a)}</div>
    </div>
    ${done && (m.hp != null || hasCards) ? `<div class="cards-line">
      ${m.hp != null ? `<span>Luân lưu: ${m.hp} - ${m.ap}</span>` : ''}
      ${hasCards ? `<span>🟨 ${m.hy||0}-${m.ay||0}</span><span>🟥 ${m.hr||0}-${m.ar||0}</span>` : ''}
    </div>` : ''}
  </div>`;
}

/* ----- Nhánh đấu ----- */
function viewBracket(){
  const ko = S.matches.filter(m => m.stage === 'ko');

  if(!ko.length){
    const seeds = getSeeds();
    const n = seeds.length;
    const valid = n >= 2 && (n & (n-1)) === 0;
    return `
    <div class="page-head">
      <div><h1>Nhánh đấu loại trực tiếp</h1>
      <p class="muted">Tứ kết · Bán kết · Chung kết · Tranh hạng 3</p></div>
    </div>
    ${emptyState('🏆', 'Chưa tạo nhánh đấu',
      `Hiện có ${n} đội đủ điều kiện đi tiếp (${S.settings.qualifiers} đội/bảng × ${S.groups.length} bảng).
       ${valid ? 'Nhấn nút bên dưới để tạo nhánh đấu.' : 'Số đội đi tiếp phải là 4, 8 hoặc 16 — hãy chỉnh trong Cài đặt hoặc thêm bảng.'}`,
      `<button class="btn primary" data-act="gen-ko" ${valid?'':'disabled'}>🏆 Tạo nhánh đấu</button>
       <button class="btn ghost" data-act="tab" data-tab="settings" style="margin-left:8px">⚙️ Cài đặt</button>`)}
    `;
  }

  const maxRound = Math.max(...ko.map(m => m.round));
  const cols = [];
  for(let r=0; r<=maxRound; r++){
    const ms = ko.filter(m => m.round === r && !m.thirdPlace).sort((a,b) => a.slot - b.slot);
    const third = ko.filter(m => m.thirdPlace && m.round === r);
    if(ms.length || third.length){
      cols.push({ name: ms[0]?.roundName || 'Tranh hạng 3', matches: ms.concat(third) });
    }
  }

  const champ = ko.find(m => m.round === maxRound && !m.thirdPlace);
  const champion = champ ? winnerOf(champ) : null;

  return `
  <div class="page-head">
    <div><h1>Nhánh đấu loại trực tiếp</h1>
      <p class="muted">Nhấn vào một trận để nhập tỉ số</p></div>
    <div class="actions">
      ${champion ? `<span class="badge" style="padding:8px 14px;font-size:13px">🏆 Vô địch: ${esc(teamName(champion))}</span>` : ''}
      <button class="btn ghost" data-act="save-folder">📁 Lưu vào thư mục</button>
      <button class="btn ghost" data-act="export-excel-results">📊 Xuất Excel kết quả</button>
      <button class="btn ghost" data-act="gen-ko">🔄 Tạo lại nhánh đấu</button>
    </div>
  </div>
  <div class="bracket">
    ${cols.map(c => `<div class="bracket-col">
      <h4>${esc(c.name)}</h4>
      ${c.matches.map(bracketMatch).join('')}
    </div>`).join('')}
  </div>`;
}

function bracketMatch(m){
  const done = m.hs != null && m.as != null;
  const w = winnerOf(m);
  const rows = [[m.homeId, m.hs, m.hp], [m.awayId, m.as, m.ap]];
  return `<div class="bmatch ${m.thirdPlace?'third':''}" data-act="score" data-id="${m.id}">
    ${rows.map(([tid, sc, pn]) => `
      <div class="brow ${tid && w === tid ? 'win' : ''}">
        <span class="bname">${tid ? esc(teamName(tid)) : '<i>Chờ kết quả</i>'}</span>
        <span class="bscore">${sc != null ? sc : '–'}${pn != null ? `<em>(${pn})</em>` : ''}</span>
      </div>`).join('')}
    <div class="bmeta">
      <span>${m.date ? fmtDate(m.date) : 'Chưa xếp'}</span>
      <span>${esc(m.time || '')}${m.pitch ? ' · ' + esc(m.pitch) : ''}</span>
    </div>
  </div>`;
}

function render(){
  S = activeT();
  const sp = sportOf(S.sportId);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === R.tab));
  document.getElementById('brandName').textContent = R.name || 'Hội thao';
  document.getElementById('brandIcon').textContent = sp.icon;
  document.getElementById('brandSub').textContent = `${sp.name} · ${genderLabel(S.gender)}`;
  document.getElementById('ctx').innerHTML = viewContext();
  document.title = `${S.name} · ${R.name}`;
  const views = { teams: viewTeams, groups: viewGroups, schedule: viewSchedule, bracket: viewBracket, settings: viewSettings };
  document.getElementById('view').innerHTML = (views[R.tab] || viewTeams)();
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
    case 'tab':
      R.tab = el.dataset.tab; save(); render(); window.scrollTo({top:0,behavior:'smooth'});
      break;

    /* Lưu & Xuất */
    case 'save-folder': saveDataToFolder(); break;
    case 'load-folder': loadDataFromFolder(); break;
    case 'export-excel-results': exportExcelResults(); break;

    /* Bộ môn & giải */
    case 'ctx-sport': {
      const sp = el.dataset.sport;
      const t = R.tournaments.find(x => x.sportId === sp && x.gender === S.gender) || R.tournaments.find(x => x.sportId === sp);
      if(t && t.id !== S.id) switchTournament(t.id);
      break;
    }
    case 'ctx-gender': if(id !== S.id) switchTournament(id); break;
    case 'ctx-add': openTournamentModal(null, el.dataset.sport ? { sportId: el.dataset.sport, gender: el.dataset.gender } : null); break;
    case 'ctx-manage': openManageModal(); break;
    case 'edit-current-t': openTournamentModal(S.id); break;

    /* Đội bóng */
    case 'add-team': openTeamModal(null); break;
    case 'edit-team': openTeamModal(id); break;
    case 'del-team': deleteTeam(id); break;
    case 'template': downloadTemplate(); break;
    case 'import': document.getElementById('excelInput')?.click(); break;

    /* Vòng bảng */
    case 'auto-groups': autoGroups(); break;
    case 'add-group': {
      const letters = 'ABCDEFGHIJ';
      const name = 'Bảng ' + (letters[S.groups.length] || (S.groups.length + 1));
      S.groups.push({ id: uid(), name, teamIds: [] });
      save(); render(); break;
    }
    case 'del-group': {
      if(!confirm('Xóa bảng này và toàn bộ trận đấu của bảng?')) break;
      S.matches = S.matches.filter(m => m.groupId !== id);
      S.groups = S.groups.filter(g => g.id !== id);
      save(); render(); break;
    }
    case 'rm-from-group': {
      const g = S.groups.find(x => x.id === el.dataset.g);
      if(!g) break;
      g.teamIds = g.teamIds.filter(x => x !== id);
      S.matches = S.matches.filter(m => !(m.stage === 'group' && m.groupId === g.id && (m.homeId === id || m.awayId === id)));
      save(); render(); break;
    }
    case 'gen-group-schedule': openGroupScheduleModal(); break;
    case 'clear-group-schedule': {
      if(!confirm('Xóa toàn bộ lịch thi đấu vòng bảng?')) break;
      S.matches = S.matches.filter(m => m.stage !== 'group');
      save(); render(); toast('Đã xóa lịch vòng bảng', 'ok'); break;
    }

    /* Nhánh đấu */
    case 'gen-ko': {
      if(S.matches.some(m => m.stage === 'ko') && !confirm('Tạo lại nhánh đấu sẽ xóa toàn bộ kết quả vòng loại trực tiếp. Tiếp tục?')) break;
      generateKnockout(); break;
    }

    /* Trận đấu */
    case 'score': openScoreModal(id); break;

    /* Cài đặt */
    case 'save-settings': {
      R.name = document.getElementById('set-event').value.trim() || 'Hội thao';
      S.name = document.getElementById('set-name').value.trim() || autoName(S.sportId, S.gender);
      S.settings.pointsWin = Math.max(0, +document.getElementById('set-win').value || 0);
      S.settings.pointsDraw = Math.max(0, +document.getElementById('set-draw').value || 0);
      S.settings.qualifiers = Math.max(1, Math.min(4, +document.getElementById('set-qual').value || 1));
      save(); render(); toast('Đã lưu cài đặt', 'ok'); break;
    }
    case 'export-json': {
      const blob = new Blob([JSON.stringify(R, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hoi-thao-backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Đã xuất dữ liệu', 'ok'); break;
    }
    case 'import-json': document.getElementById('jsonInput')?.click(); break;
    case 'reset-all': {
      if(!confirm('XÓA TOÀN BỘ dữ liệu của TẤT CẢ bộ môn và giải đấu? Hành động này không thể hoàn tác.')) break;
      if(!confirm('Bạn chắc chắn chứ? Toàn bộ giải, đội, lịch đấu và kết quả sẽ bị xóa.')) break;
      setRoot(defaultRoot()); save(); render(); toast('Đã xóa toàn bộ dữ liệu', 'ok'); break;
    }
    case 'reset-current': {
      if(!confirm(`Xóa toàn bộ đội, bảng đấu và trận đấu của "${S.name}"?`)) break;
      Object.assign(S, { teams: [], groups: [], matches: [] });
      save(); render(); toast('Đã làm trống giải hiện tại', 'ok'); break;
    }
  }
});

/* Change events */
document.addEventListener('change', e => {
  const t = e.target;

  /* --- File inputs phải xử lý TRƯỚC, vì chúng không có [data-act] --- */
  if(t.id === 'excelInput' && t.files && t.files[0]){
    importExcel(t.files[0]);
    t.value = '';
    return;
  }
  if(t.id === 'jsonInput' && t.files && t.files[0]){
    const r = new FileReader();
    r.onload = ev => {
      try{
        const p = JSON.parse(ev.target.result);
        const scope = applyImported(p);
        save(); render();
        toast(scope === 'all' ? 'Đã nhập dữ liệu tất cả giải' : `Đã nhập dữ liệu vào "${S.name}"`, 'ok');
      }catch(err){ toast('File không hợp lệ', 'err'); }
    };
    r.readAsText(t.files[0]);
    t.value = '';
    return;
  }

  /* --- Các change khác (có [data-act]) --- */
  const el = t.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'add-to-group'){
    const g = S.groups.find(x => x.id === el.dataset.g);
    if(g && el.value){
      S.groups.forEach(o => o.teamIds = o.teamIds.filter(x => x !== el.value));
      g.teamIds.push(el.value);
      save(); render();
    }
  }
  if(act === 'f-stage'){ fStage = el.value; render(); }
  if(act === 'f-group'){ fGroup = el.value; render(); }
  if(act === 'f-status'){ fStatus = el.value; render(); }
});

/* Search input */
document.addEventListener('input', e => {
  if(e.target.id === 'teamSearch'){
    searchQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const inp = document.getElementById('teamSearch');
    if(inp){ inp.focus(); inp.setSelectionRange(pos, pos); }

});
